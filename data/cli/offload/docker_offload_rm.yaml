command: docker offload rm
short: Remove the Docker Offload cloud sandbox
long: |-
  Remove the Docker Offload cloud sandbox.

  This command is available when **Enable Docker Offload** is turned off in
  Docker Desktop settings, or doesn't appear. If the setting is on, your Docker
  commands use Docker Offload v1, which has no sandbox to remove.

  The sandbox is deleted with everything in it, running or paused. Every
  machine on the account uses the same sandbox, so `rm` deletes it for all of
  them. To keep the sandbox for later, use `docker offload stop` instead.

  The next `docker offload create` makes a new sandbox, which starts with the
  default idle timeout of 5m.
usage: docker offload rm [OPTIONS]
pname: docker offload
plink: docker_offload.yaml
options:
  - option: account
    shorthand: a
    value_type: string
    default_value: ""
    description: The Docker account the sandbox is under
    deprecated: false
    hidden: true
    experimental: false
    experimentalcli: false
    kubernetes: false
    swarm: false
  - option: force
    shorthand: f
    value_type: bool
    default_value: "false"
    description: Remove without asking for confirmation
    deprecated: false
    hidden: false
    experimental: false
    experimentalcli: false
    kubernetes: false
    swarm: false
examples: |-
  ### Remove the sandbox

  Asks for confirmation first:

  ```console
  $ docker offload rm
  ```

  ### Remove the sandbox without confirmation

  ```console
  $ docker offload rm --force
  ```
deprecated: false
hidden: false
experimental: false
experimentalcli: false
kubernetes: false
swarm: false
